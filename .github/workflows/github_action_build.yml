name: LaTeX Build and Upload

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This step is replaced by pulling the image from GHCR
      - name: Pull Docker Image from GHCR
        run: docker pull ghcr.io/${{ github.repository_owner }}/latex-build:latest

      - name: Run Docker Container
        run: docker run -v $(pwd):/latex_content --name latex-container ghcr.io/${{ github.repository_owner }}/latex-build:latest make pdf-all

      - name: Copy PDFs from Docker Container
        run: |
          docker cp latex-container:/latex_content/cv-esteban-martinena-two-columns.pdf .
          docker cp latex-container:/latex_content/cv-esteban-martinena-plain.pdf .
          docker cp latex-container:/latex_content/cv-esteban-martinena-two-columns-cover.png .
          docker cp latex-container:/latex_content/cv-esteban-martinena-plain-cover.png .

      - name: Upload PDFs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdf-${{ github.ref_slug }}
          path: cv-esteban-martinena-*

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: ${{ contains(github.ref, 'tags') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "cv-esteban-martinena-*"
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: "Latest version of my CV."

      # TODO: Attach pdf to readme.md using sed and the latest release
